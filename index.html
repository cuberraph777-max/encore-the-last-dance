<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <section class="todo-panel">
        <header class="header">
          <div>
            <p class="eyebrow">Today</p>
            <h1>To-Do List</h1>
          </div>
          <span id="taskCount" class="count-badge">0 tasks</span>
        </header>

        <form id="todoForm" class="todo-form" autocomplete="off">
          <label class="sr-only" for="todoInput">Add a task</label>
          <input
            id="todoInput"
            type="text"
            maxlength="160"
            placeholder="Add a new task..."
            aria-label="Add a new task"
          />
          <button type="submit">Add</button>
        </form>

        <div class="toolbar">
          <div class="filters" aria-label="Task filters">
            <button class="filter-btn active" data-filter="all" type="button">All</button>
            <button class="filter-btn" data-filter="active" type="button">Active</button>
            <button class="filter-btn" data-filter="completed" type="button">Completed</button>
          </div>
          <button id="clearCompleted" class="clear-btn" type="button">Clear completed</button>
        </div>

        <ul id="todoList" class="todo-list" aria-live="polite"></ul>

        <p id="emptyState" class="empty-state">No tasks yet. Add one to get started.</p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
