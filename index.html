<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>LAST ENCORE — The Last Dance</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="game-app">
      <canvas id="gameCanvas" width="960" height="600"></canvas>

      <div id="titleScreen" class="screen active">
        <div class="title-card">
          <div class="title-layout">
            <div class="title-copy">
              <div class="logo-stack">
                <div class="logo">LAST ENCORE</div>
                <div class="sublogo">THE LAST DANCE</div>
              </div>

              <div class="title-menu" aria-label="Main menu">
                <button id="startBtn" class="menu-item selected"><span class="cursor">♥</span> Start</button>
                <button class="menu-item"><span class="cursor">♥</span> Difficulty</button>
                <button class="menu-item"><span class="cursor">♥</span> Settings</button>
                <button class="menu-item"><span class="cursor">♥</span> Quit</button>
              </div>
            </div>

            <div class="showman-scene" aria-hidden="true">
              <div class="showman-art">
                <div class="horn left"></div>
                <div class="horn right"></div>
                <div class="head">
                  <div class="ear left"></div>
                  <div class="ear right"></div>
                  <div class="eye left"></div>
                  <div class="eye right"></div>
                  <div class="grin"></div>
                </div>
                <div class="collar"></div>
                <div class="body"></div>
                <div class="arm left"></div>
                <div class="arm right"></div>
                <div class="tail"></div>
              </div>
            </div>
          </div>

          <div class="title-bottom-row">
            <div class="difficulty-wrap">
              <button class="difficulty-btn" data-difficulty="easy">Easy</button>
              <button class="difficulty-btn active" data-difficulty="hard">Hard</button>
              <button class="difficulty-btn" data-difficulty="painful">Painful</button>
            </div>
            <button id="rehearsalBtn" class="menu-btn small">Rehearsal</button>
            <button id="muteBtn" class="menu-btn small">Mute</button>
          </div>
        </div>
      </div>

      <div id="hud" class="hud hidden">
        <div class="top-row">
          <div id="playerPanel" class="stat-box">
            <span>YOU</span>
            <strong id="playerHp">20 / 20</strong>
          </div>
          <div id="bossPanel" class="stat-box boss-box">
            <span>SHOWMAN</span>
            <strong id="bossHp">40 / 40</strong>
          </div>
        </div>

        <div id="modePanel" class="mode-panel">
          <button class="mode-btn active" data-mode="red">RED</button>
          <button class="mode-btn" data-mode="green">GREEN</button>
          <button class="mode-btn" data-mode="blue">BLUE</button>
          <button class="mode-btn" data-mode="yellow">YELLOW</button>
          <button class="mode-btn" data-mode="purple">PURPLE</button>
        </div>

        <div id="stateLine" class="state-line">The Showman is ready.</div>

        <div id="actionMenu" class="battle-menu">
          <button data-action="fight">FIGHT</button>
          <button data-action="act">ACT</button>
          <button data-action="item">ITEM</button>
          <button data-action="mercy">MERCY</button>
          <button data-action="check">CHECK</button>
        </div>

        <div id="subMenu" class="sub-menu hidden"></div>
      </div>

      <div id="dialogue" class="dialogue hidden"></div>
      <div id="pauseOverlay" class="overlay hidden">PAUSED</div>
      <div id="gameOverOverlay" class="overlay hidden">GAME OVER</div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
